<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- back terminal card -->
  <rect x="8" y="12" width="40" height="32" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <!-- front terminal card, offset to suggest a pair -->
  <rect x="16" y="20" width="40" height="32" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <!-- prompt chevron -->
  <path d="M 24 31 L 30 36 L 24 41" stroke="#58a6ff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- blinking cursor bar -->
  <rect x="34" y="34" width="10" height="3" rx="1" fill="#58a6ff"/>
</svg>
