[workspace]
resolver = "2"
members = [
    "crates/telepair-core",
    "crates/telepair-agent",
    "crates/telepair-control",
    "crates/telepair-gateway",
    "crates/telepair-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/telepair/telepair"

[workspace.dependencies]
# Internal crates
telepair-core = { path = "crates/telepair-core" }
telepair-agent = { path = "crates/telepair-agent" }
telepair-control = { path = "crates/telepair-control" }
telepair-gateway = { path = "crates/telepair-gateway" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# PTY
portable-pty = "0.8"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Auth
sha2 = "0.10"
hex = "0.4"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }
nanoid = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Futures
futures = "0.3"

# Zero-copy byte buffers (shared with axum/hyper via same version)
bytes = "1"

# Testing
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
tempfile = "3"

# CLI extras
anyhow = "1"
dirs = "6"
